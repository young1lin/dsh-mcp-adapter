# Publish @young1lin/dsh-mcp-adapter to npm via Trusted Publishing (OIDC).
#
# Trigger: pushing a vX.Y.Z tag. Authentication is npm Trusted Publishing —
# the GitHub Actions OIDC token identifies this workflow to npm; there is NO
# NPM_TOKEN / NODE_AUTH_TOKEN secret anywhere. Provenance is generated
# automatically by npm for trusted-publishing uploads, no flag needed.
#
# Requires (one-time, manual):
#   1. the package to already exist on npm — satisfied: 0.3.2 is published
#   2. npmjs.com -> package Settings -> Trusted publishing configured with
#      user young1lin / repo dsh-mcp-adapter / workflow publish.yml
#
# Node 24 because Trusted Publishing needs npm >= 11.5.1; Node 22's bundled
# npm is older, so the step below upgrades npm only when below that bar.
#
# Unlike dsh-gpt-sub (pnpm, lib/), this repo is npm-based and ships dist/
# build output (gitignored): the workflow builds it before packing. Both
# test suites run as the release gate — npm test (host/client, node --test)
# and npm run test:engine (vitest).
name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm >= 11.5.1 (Trusted Publishing requirement)
        run: |
          npm --version
          if [ "$(printf '%s\n' '11.5.1' "$(npm --version)" | sort -V | head -n1)" != '11.5.1' ]; then
            npm install -g npm@latest
            npm --version
          fi

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag: ${TAG}, package.json: ${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "git tag ${TAG} does not match package.json version ${PKG}" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsc + esbuild client -> dist/)
        run: npm run build

      - name: Test host/client (node --test)
        run: npm test

      - name: Test engine (vitest)
        run: npm run test:engine

      - name: Verify publish contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
